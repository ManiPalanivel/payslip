<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#fff5f8;
    padding-top:100px;
}
.gift{
    font-size:80px;
    cursor:pointer;
}
.message{
    display:none;
    margin-top:30px;
    font-size:24px;
    color:#e91e63;
}
</style>
</head>
<body>

<div class="gift" onclick="showMessage()">🎁</div>

<div class="message" id="msg">
🎉 I hope you get a positive response from home.<br><br>
It would make me happier than anyone else. ❤️
</div>

<script>
function showMessage() {
    document.getElementById("msg").style.display = "block";
}
</script>

</body>
</html>
